<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" fill="none">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF1A75" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1A75" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="51%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Sound Waves -->
  <g stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M 46 22 A 28 28 0 0 0 46 68" />
    <path d="M 34 14 A 38 38 0 0 0 34 76" opacity="0.9" />
    <path d="M 22 6 A 48 48 0 0 0 22 84" opacity="0.8" />
  </g>

  <!-- BACKSTAGE Text -->
  <g font-family="'Montserrat', 'Impact', 'Bebas Neue', sans-serif" font-weight="900" font-size="46" letter-spacing="1">
    <!-- BACK -->
    <text x="60" y="60" fill="#FFFFFF">BACK</text>
    
    <!-- S with split color gradient -->
    <text x="210" y="60" fill="url(#sGrad)">S</text>
    
    <!-- TAGE -->
    <text x="246" y="60" fill="#FFFFFF">TAGE</text>
  </g>

  <!-- Right Sound Waves -->
  <g stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M 408 22 A 28 28 0 0 1 408 68" />
    <path d="M 420 14 A 38 38 0 0 1 420 76" opacity="0.9" />
    <path d="M 432 6 A 48 48 0 0 1 432 84" opacity="0.8" />
  </g>

  <!-- Small KARAOKÊ badge below / right -->
  <g font-family="'Montserrat', sans-serif" font-weight="800" font-size="9" letter-spacing="6" fill="#00E5FF">
    <text x="180" y="80" text-anchor="middle">KARAOKÊ</text>
  </g>
</svg>
