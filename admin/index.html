<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | Backstage Karaokê</title>
  
  <!-- Prevenir indexação de páginas administrativas em buscadores -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060914">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/src/admin/admin.css">
</head>
<body class="admin-body">
  <div class="admin-bg-glow"></div>
  
  <!-- Container da aplicação SPA do Painel Administrativo -->
  <div id="adminApp">
    <!-- Loader Inicial enquanto verifica a autenticação do Firebase -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;">
      <div style="width: 44px; height: 44px; border: 3px solid rgba(0, 240, 255, 0.2); border-top-color: #00F0FF; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <p style="color: #94A3B8; font-size: 0.9rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;">Carregando Painel Administrativo...</p>
    </div>
  </div>

  <!-- Container Global de Notificações Toast -->
  <div id="adminToastContainer" class="admin-toast-container"></div>

  <!-- Modal Global de Confirmação -->
  <div id="adminConfirmModal" class="admin-modal-overlay">
    <div class="admin-modal-card" style="max-width: 440px;">
      <div class="admin-modal-header">
        <h3 class="admin-modal-title" id="confirmModalTitle">Confirmação</h3>
        <button type="button" class="admin-modal-close" onclick="window.closeConfirmModal()">&times;</button>
      </div>
      <div class="admin-modal-body">
        <p id="confirmModalMessage" style="color: var(--admin-text-muted); line-height: 1.6;"></p>
      </div>
      <div class="admin-modal-footer">
        <button type="button" class="btn-admin btn-admin-outline btn-admin-sm" onclick="window.closeConfirmModal()">Cancelar</button>
        <button type="button" class="btn-admin btn-admin-danger btn-admin-sm" id="confirmModalActionBtn">Confirmar</button>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Script Principal do Painel -->
  <script type="module" src="/src/admin/admin.js"></script>
</body>
</html>
