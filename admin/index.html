<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | Backstage Karaokê</title>
  
  <!-- Prevenir indexação de páginas administrativas em buscadores -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060914">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/src/admin/admin.css">
</head>
<body class="admin-body">
  <div class="admin-bg-glow"></div>
  
  <!-- Container da aplicação SPA do Painel Administrativo -->
  <div id="adminApp">
    <!-- Loader Inicial enquanto verifica a autenticação do Firebase -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;">
      <div style="width: 44px; height: 44px; border: 3px solid rgba(0, 240, 255, 0.2); border-top-color: #00F0FF; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <p style="color: #94A3B8; font-size: 0.9rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;">Carregando Painel Administrativo...</p>
    </div>
  </div>

  <!-- Container Global de Notificações Toast -->
  <div id="adminToastContainer" class="admin-toast-container"></div>

  <!-- Modal Global de Confirmação -->
  <div id="adminConfirmModal" class="admin-modal-overlay">
    <div class="admin-modal-card" style="max-width: 440px;">
      <div class="admin-modal-header">
        <h3 class="admin-modal-title" id="confirmModalTitle">Confirmação</h3>
        <button type="button" class="admin-modal-close" onclick="window.closeConfirmModal()">&times;</button>
      </div>
      <div class="admin-modal-body">
        <p id="confirmModalMessage" style="color: var(--admin-text-muted); line-height: 1.6;"></p>
      </div>
      <div class="admin-modal-footer">
        <button type="button" class="btn-admin btn-admin-outline btn-admin-sm" onclick="window.closeConfirmModal()">Cancelar</button>
        <button type="button" class="btn-admin btn-admin-danger btn-admin-sm" id="confirmModalActionBtn">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Modal de Upload de Mídia (Fotos e Vídeos por Upload) -->
  <div id="adminMediaUploadModal" class="admin-modal-overlay">
    <div class="admin-modal-card" style="max-width: 520px;">
      <div class="admin-modal-header">
        <h3 class="admin-modal-title" id="mediaUploadModalTitle">Upload de Mídia</h3>
        <button type="button" class="admin-modal-close" onclick="window.closeMediaUploadModal()">&times;</button>
      </div>
      <form id="formUploadMedia" onsubmit="window.submitMediaUpload(event)">
        <div class="admin-modal-body">
          <!-- Sala / Destino -->
          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label" for="uploadMediaSala">Vincular à Sala</label>
            <select id="uploadMediaSala" class="form-select" required>
              <option value="sala-red">Sala 1 — Sala Red</option>
              <option value="sala-green">Sala 2 — Sala Green</option>
              <option value="sala-blue">Sala 3 — Sala Blue</option>
              <option value="geral">Geral / Palco / Espaço</option>
            </select>
          </div>

          <!-- Tipo de Mídia -->
          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label">Tipo de Arquivo</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <label class="media-type-option" id="labelTypeFoto" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 8px; border: 1px solid var(--admin-cyan); cursor: pointer; background: rgba(0,240,255,0.08);">
                <input type="radio" name="mediaTypeRadio" value="imagem" checked onchange="window.handleMediaTypeChange('imagem')" style="margin: 0;">
                <span style="font-weight: 700; font-size: 0.9rem;">📷 Foto (Imagem)</span>
              </label>
              <label class="media-type-option" id="labelTypeVideo" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 8px; border: 1px solid var(--admin-border); cursor: pointer; background: rgba(255,255,255,0.03);">
                <input type="radio" name="mediaTypeRadio" value="video" onchange="window.handleMediaTypeChange('video')" style="margin: 0;">
                <span style="font-weight: 700; font-size: 0.9rem;">🎬 Vídeo (Upload)</span>
              </label>
            </div>
          </div>

          <!-- Título / Descrição -->
          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label" for="uploadMediaTitulo">Título / Descrição</label>
            <input type="text" id="uploadMediaTitulo" class="form-input" placeholder="Ex: Iluminação cênica da sala" required>
          </div>

          <!-- Seleção do Arquivo de Upload -->
          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label" id="uploadMediaFileLabel">Arquivo de Imagem (JPG, PNG, WebP)</label>
            <input type="file" id="uploadMediaFileInput" class="form-input" accept="image/*" required onchange="window.handleMediaFileSelected(event)" style="padding: 10px;">
            <div id="uploadMediaFileInfo" style="font-size: 0.8rem; color: var(--admin-cyan); margin-top: 6px; display: none;"></div>
          </div>

          <!-- Barra de Progresso de Upload -->
          <div id="mediaUploadProgressWrap" style="display: none; margin-top: 14px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 6px;">
              <span id="mediaUploadProgressText" style="color: var(--admin-cyan); font-weight: 600;">Enviando ao Firebase Storage...</span>
              <span id="mediaUploadProgressPercent" style="color: #FFFFFF; font-weight: 700;">0%</span>
            </div>
            <div style="width: 100%; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden;">
              <div id="mediaUploadProgressBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #00F0FF, #FF0055); transition: width 0.2s ease;"></div>
            </div>
          </div>
        </div>
        <div class="admin-modal-footer">
          <button type="button" class="btn-admin btn-admin-outline btn-admin-sm" onclick="window.closeMediaUploadModal()">Cancelar</button>
          <button type="submit" class="btn-admin btn-admin-primary btn-admin-sm" id="btnSubmitMediaUpload">Fazer Upload</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de Item do Cardápio (Adicionar / Editar) -->
  <div id="adminCardapioItemModal" class="admin-modal-overlay">
    <div class="admin-modal-card" style="max-width: 540px;">
      <div class="admin-modal-header">
        <h3 class="admin-modal-title" id="cardapioModalTitle">Adicionar Item ao Cardápio</h3>
        <button type="button" class="admin-modal-close" onclick="window.closeCardapioItemModal()">&times;</button>
      </div>
      <form id="formCardapioItem" onsubmit="window.saveCardapioItem(event)">
        <input type="hidden" id="modalItemId">
        <div class="admin-modal-body">
          <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label" for="modalItemNome">Nome do Prato / Drink *</label>
            <input type="text" id="modalItemNome" class="form-input" placeholder="Ex: Picanha na Chapa, Gin Tropical..." required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;">
            <div class="form-group">
              <label class="form-label" for="modalItemPreco">Preço Oficial (R$) *</label>
              <input type="number" step="0.01" min="0" id="modalItemPreco" class="form-input" placeholder="0.00" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="modalItemCategoria">Categoria *</label>
              <select id="modalItemCategoria" class="form-select" required>
                <!-- Preenchido dinamicamente -->
              </select>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label" for="modalItemDesc">Descrição / Ingredientes</label>
            <textarea id="modalItemDesc" class="form-input" rows="3" placeholder="Detalhes dos ingredientes, acompanhamentos ou dosagem..." style="resize: vertical;"></textarea>
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label" for="modalItemFoto">Foto do Prato / Drink (Upload Rápido Opcional)</label>
            <input type="file" id="modalItemFoto" class="form-input" accept="image/*" style="padding: 8px;">
            <div id="modalItemFotoInfo" style="font-size: 0.78rem; color: var(--admin-cyan); margin-top: 4px; display: none;"></div>
          </div>

          <div class="form-group">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #FFFFFF; font-weight: 600; font-size: 0.9rem;">
              <input type="checkbox" id="modalItemAtivo" checked style="width: 18px; height: 18px; accent-color: var(--admin-cyan);">
              <span>Disponível e ativo no site oficial</span>
            </label>
          </div>
        </div>
        <div class="admin-modal-footer">
          <button type="button" class="btn-admin btn-admin-outline btn-admin-sm" onclick="window.closeCardapioItemModal()">Cancelar</button>
          <button type="submit" class="btn-admin btn-admin-primary btn-admin-sm" id="btnSalvarItemCardapio">Salvar no Banco de Dados</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de Sala Privada (Adicionar / Editar) -->
  <div id="adminSalaModal" class="admin-modal-overlay">
    <div class="admin-modal-card" style="max-width: 520px;">
      <div class="admin-modal-header">
        <h3 class="admin-modal-title" id="salaModalTitle">Editar Sala Privada</h3>
        <button type="button" class="admin-modal-close" onclick="window.closeSalaModal()">&times;</button>
      </div>
      <form id="formSalaModal" onsubmit="window.saveSala(event)">
        <input type="hidden" id="modalSalaId">
        <div class="admin-modal-body">
          <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label" for="modalSalaNome">Nome da Sala *</label>
            <input type="text" id="modalSalaNome" class="form-input" placeholder="Ex: Sala Red, Sala VIP Gold..." required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;">
            <div class="form-group">
              <label class="form-label" for="modalSalaCapacidade">Capacidade Máxima (Pessoas) *</label>
              <input type="number" min="1" max="200" id="modalSalaCapacidade" class="form-input" placeholder="30" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="modalSalaPrecoTotal">Preço Total de Locação (R$) *</label>
              <input type="number" step="1" min="0" id="modalSalaPrecoTotal" class="form-input" placeholder="800" required>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label" for="modalSalaDesc">Descrição Promocional da Sala</label>
            <textarea id="modalSalaDesc" class="form-input" rows="2" placeholder="Destaques, iluminação, conforto ou recomendação..." style="resize: vertical;"></textarea>
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label" for="modalSalaFoto">Foto da Sala (Upload Rápido Opcional)</label>
            <input type="file" id="modalSalaFoto" class="form-input" accept="image/*" style="padding: 8px;">
            <div id="modalSalaFotoInfo" style="font-size: 0.78rem; color: var(--admin-cyan); margin-top: 4px; display: none;"></div>
          </div>

          <div class="form-group">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #FFFFFF; font-weight: 600; font-size: 0.9rem;">
              <input type="checkbox" id="modalSalaAtiva" checked style="width: 18px; height: 18px; accent-color: var(--admin-cyan);">
              <span>Sala disponível para reservas no site</span>
            </label>
          </div>
        </div>
        <div class="admin-modal-footer">
          <button type="button" class="btn-admin btn-admin-outline btn-admin-sm" onclick="window.closeSalaModal()">Cancelar</button>
          <button type="submit" class="btn-admin btn-admin-primary btn-admin-sm" id="btnSalvarSala">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Script Principal do Painel -->
  <script type="module" src="/src/admin/admin.js"></script>
</body>
</html>
